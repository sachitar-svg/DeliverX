<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeliverX — Login</title>
  <link rel="stylesheet" href="/Frontend/styles.css">
  <style>
    body { display:flex; min-height:100vh; overflow-x:hidden; }
    .login-bg { position:fixed; inset:0; background:linear-gradient(135deg,#667eea,#764ba2 25%,#f093fb 50%,#4facfe 75%,#00f2fe); background-size:400% 400%; animation:gradShift 15s ease infinite; z-index:-1; }
    @keyframes gradShift { 0%{background-position:0 50%} 50%{background-position:100% 50%} 100%{background-position:0 50%} }
    .shapes { position:fixed; inset:0; z-index:-1; overflow:hidden; }
    .shape { position:absolute; opacity:.1; border-radius:50%; }
    .shape-1 { width:300px; height:300px; background:#fff; top:-50px; left:-50px; animation:fl 20s infinite ease-in-out; }
    .shape-2 { width:250px; height:250px; background:#fff; bottom:-30px; right:10%; animation:fl 25s infinite ease-in-out reverse; }
    @keyframes fl { 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,30px)} }
    .login-container { width:100%; display:flex; align-items:center; justify-content:center; padding:var(--spacing-lg); }
    .login-wrapper { width:100%; max-width:1000px; display:grid; grid-template-columns:1fr 1fr; gap:var(--spacing-xl); align-items:center; }
    .login-brand { color:#fff; padding:var(--spacing-lg); animation:slideL .6s ease-out; }
    @keyframes slideL { from{opacity:0;transform:translateX(-30px)} to{opacity:1;transform:none} }
    .brand-logo { font-size:3.5rem; margin-bottom:var(--spacing-md); animation:bounce 2s ease-in-out infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .brand-title { font-size:2.5rem; font-weight:800; margin-bottom:var(--spacing-sm); }
    .brand-sub { font-size:1.1rem; opacity:.95; line-height:1.6; margin-bottom:var(--spacing-lg); }
    .brand-features { display:flex; flex-direction:column; gap:var(--spacing-md); }
    .feat { display:flex; gap:var(--spacing-md); align-items:flex-start; font-size:.95rem; opacity:.9; }
    .feat-icon { font-size:1.5rem; min-width:30px; }
    .login-form-wrapper { animation:slideR .6s ease-out; }
    @keyframes slideR { from{opacity:0;transform:translateX(30px)} to{opacity:1;transform:none} }
    .login-card { background:rgba(255,255,255,.97); border-radius:var(--radius-xl); padding:var(--spacing-xl); box-shadow:0 20px 60px rgba(0,0,0,.15); }
    @media (prefers-color-scheme:dark) { .login-card { background:rgba(30,41,59,.97); } }
    .login-card h1 { font-size:1.8rem; margin-bottom:var(--spacing-sm); color:var(--primary); }
    .login-card > p { font-size:.9rem; color:var(--text2); margin-bottom:var(--spacing-lg); }
    .role-selector { display:grid; grid-template-columns:repeat(2,1fr); gap:var(--spacing-md); margin-bottom:var(--spacing-xl); }
    .role-option input[type="radio"] { display:none; }
    .role-label { display:flex; flex-direction:column; align-items:center; gap:var(--spacing-sm); padding:var(--spacing-lg); border:2px solid var(--border); border-radius:var(--radius-lg); cursor:pointer; transition:var(--transition); background:var(--bg3); text-align:center; }
    .role-label:hover { border-color:var(--primary); transform:translateY(-2px); }
    .role-option input:checked + .role-label { border-color:var(--primary); background:rgba(37,99,235,.1); box-shadow:0 0 0 3px rgba(37,99,235,.15); }
    .role-icon { font-size:2rem; }
    .role-name { font-weight:600; color:var(--text); font-size:.9rem; }
    .role-desc { font-size:.75rem; color:var(--text2); }
    .form-row { display:flex; justify-content:space-between; align-items:center; font-size:.85rem; margin-bottom:var(--spacing-lg); }
    .form-row label { display:flex; align-items:center; gap:6px; cursor:pointer; font-weight:normal; }
    .btn-login { width:100%; padding:14px; background:linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; border:none; border-radius:var(--radius-lg); font-size:1rem; font-weight:700; cursor:pointer; transition:var(--transition); box-shadow:0 8px 20px rgba(37,99,235,.25); }
    .btn-login:hover:not(:disabled) { transform:translateY(-2px); }
    .btn-login:disabled { opacity:.7; cursor:not-allowed; }
    .login-alert { padding:var(--spacing-md); border-radius:var(--radius-md); font-size:.9rem; margin-bottom:var(--spacing-lg); animation:slideDown .3s ease-out; }
    @keyframes slideDown { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:none} }
    @media (max-width:768px) { .login-wrapper{grid-template-columns:1fr} .login-brand{display:none} .role-selector{grid-template-columns:1fr} }
  </style>
</head>
<body>
<div class="login-bg"></div>
<div class="shapes"><div class="shape shape-1"></div><div class="shape shape-2"></div></div>

<div class="login-container">
  <div class="login-wrapper">
    <div class="login-brand">
      <div class="brand-logo">📦</div>
      <h1 class="brand-title">DeliverX</h1>
      <p class="brand-sub">Smarter Logistics & Last-Mile Delivery Optimization</p>
      <div class="brand-features">
        <div class="feat"><div class="feat-icon">⚡</div><div>Real-time order tracking and optimization</div></div>
        <div class="feat"><div class="feat-icon">🗺️</div><div>AI-powered route optimization for agents</div></div>
        <div class="feat"><div class="feat-icon">♻️</div><div>Carbon-neutral delivery initiatives</div></div>
        <div class="feat"><div class="feat-icon">🎯</div><div>Smart hub allocation and resource management</div></div>
      </div>
    </div>

    <div class="login-form-wrapper">
      <div class="login-card">
        <h1>Welcome Back</h1>
        <p>Sign in to your DeliverX account</p>
        <div id="alertBox"></div>
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div style="margin-bottom:var(--spacing-lg)">
            <label style="display:block;margin-bottom:var(--spacing-sm);font-weight:600;font-size:.85rem;text-transform:uppercase;letter-spacing:.5px">Select Your Role</label>
            <div class="role-selector">
              <div class="role-option">
                <input type="radio" id="role-customer" name="role" value="customer" required>
                <label for="role-customer" class="role-label"><div class="role-icon">👤</div><div class="role-name">Customer</div><div class="role-desc">Place orders</div></label>
              </div>
              <div class="role-option">
                <input type="radio" id="role-agent" name="role" value="agent">
                <label for="role-agent" class="role-label"><div class="role-icon">🚚</div><div class="role-name">Agent</div><div class="role-desc">Deliver orders</div></label>
              </div>
              <div class="role-option">
                <input type="radio" id="role-hub" name="role" value="hub">
                <label for="role-hub" class="role-label"><div class="role-icon">📦</div><div class="role-name">Hub Manager</div><div class="role-desc">Manage hub</div></label>
              </div>
              <div class="role-option">
                <input type="radio" id="role-admin" name="role" value="admin">
                <label for="role-admin" class="role-label"><div class="role-icon">⚙️</div><div class="role-name">Admin</div><div class="role-desc">System control</div></label>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
          </div>
          <div class="form-row">
            <label><input type="checkbox" id="remember" style="width:16px;height:16px"> Remember me</label>
          </div>
          <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="/Frontend/config.js"></script>
<script src="/Frontend/api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const urlRole = new URLSearchParams(window.location.search).get('role');
  const radio = document.getElementById('role-' + (urlRole || 'customer'));
  if (radio) { radio.checked = true; fillCreds(urlRole || 'customer'); }

  document.querySelectorAll('.role-option input[type="radio"]').forEach(r => {
    r.addEventListener('change', e => fillCreds(e.target.value));
  });
});

function fillCreds(role) {
  const creds = config.DEMO_CREDENTIALS[role];
  if (creds) {
    document.getElementById('email').value    = creds.email;
    document.getElementById('password').value = creds.password;
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const role     = document.querySelector('input[name="role"]:checked')?.value;
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  const btn      = document.getElementById('loginBtn');

  if (!role || !email || !password) { showAlert('Please fill in all fields', 'error'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Signing in…';

  try {
    const res = await api.login(email, password, role);
    session.setRole(role, res.user_id, res.token, res.hub_id || null);
    // ✅ Use Flask routes instead of direct .html file paths
    const routes = { customer:'/customer', agent:'/agent', hub:'/hub', admin:'/admin' };
    window.location.href = routes[role];
  } catch(err) {
    showAlert('Login failed: ' + err.message, 'error');
    btn.disabled = false;
    btn.innerHTML = 'Sign In';
  }
}

function showAlert(msg, type='info') {
  const box = document.getElementById('alertBox');
  const el  = document.createElement('div');
  el.className = 'login-alert';
  el.style.background = type === 'error' ? '#fef2f2' : '#eff6ff';
  el.style.borderLeft  = type === 'error' ? '4px solid var(--danger)' : '4px solid var(--primary)';
  el.style.color       = type === 'error' ? '#991b1b' : '#1e40af';
  el.innerHTML = msg;
  box.innerHTML = '';
  box.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}
</script>
</body>
</html>
